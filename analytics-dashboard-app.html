<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Overview - Professional Dashboard</title>
    <style>
        /* Theme System - Dark Professional */
        :root {
            /* Dark Theme Colors */
            --bg-primary: #1a1f2e;
            --bg-secondary: #242b3d;
            --bg-card: #2a3142;
            --bg-card-hover: #313847;

            /* Text Colors */
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #718096;

            /* Accent Colors */
            --accent-green: #10b981;
            --accent-green-light: #34d399;
            --accent-orange: #f59e0b;
            --accent-orange-light: #fbbf24;
            --accent-purple: #6366f1;
            --accent-purple-light: #818cf8;

            /* Badge Colors */
            --badge-bg: #3b4562;
            --badge-text: #e2e8f0;

            /* Spacing & Sizing */
            --border-radius-sm: 0.5rem;
            --border-radius-md: 0.75rem;
            --border-radius-lg: 1.25rem;
            --border-radius-xl: 1.5rem;

            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6);

            /* Animation */
            --transition-fast: 150ms ease-in-out;
            --transition-normal: 300ms ease-in-out;
            --transition-slow: 500ms ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }

        /* Container */
        .dashboard-container {
            max-width: 400px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 24px;
            animation: fadeIn 0.5s ease-out;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .header-content h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .header-content p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .header-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--border-radius-sm);
            background: var(--bg-card);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all var(--transition-normal);
        }

        .icon-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            transition: all var(--transition-normal);
            cursor: pointer;
        }

        .metric-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .metric-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metric-change {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .metric-change.positive {
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
        }

        .metric-change.warning {
            color: var(--accent-orange);
            background: rgba(245, 158, 11, 0.15);
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width var(--transition-slow);
            animation: progressAnimation 1s ease-out;
        }

        .progress-fill.green {
            background: linear-gradient(90deg, var(--accent-green) 0%, var(--accent-green-light) 100%);
        }

        .progress-fill.orange {
            background: linear-gradient(90deg, var(--accent-orange) 0%, var(--accent-orange-light) 100%);
        }

        /* Traffic Sources */
        .traffic-section {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            margin-bottom: 20px;
        }

        .traffic-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .traffic-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .time-badge {
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            background: var(--badge-bg);
            color: var(--badge-text);
            border-radius: var(--border-radius-sm);
        }

        .traffic-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .traffic-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            transition: all var(--transition-fast);
        }

        .traffic-item:hover {
            transform: translateX(4px);
        }

        .traffic-source {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .traffic-percentage {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Full Report Button */
        .report-button {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-purple-light) 100%);
            color: var(--text-primary);
            border: none;
            border-radius: var(--border-radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .report-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .report-button:active {
            transform: translateY(0);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes progressAnimation {
            from {
                width: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .dashboard-container {
                padding: 20px;
            }

            .header-content h1 {
                font-size: 20px;
            }

            .metric-value {
                font-size: 24px;
            }

            .metrics-grid {
                gap: 12px;
            }

            .metric-card {
                padding: 16px;
            }
        }

        /* Icon Styles */
        .icon {
            width: 20px;
            height: 20px;
        }

        /* Pulse Animation for Live Data */
        .live-indicator {
            position: relative;
        }

        .live-indicator::before {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            top: 2px;
            left: -12px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1>Analytics Overview</h1>
                <p>Performance metrics</p>
            </div>
            <div class="header-icons">
                <button class="icon-btn" title="User Profile" onclick="handleProfileClick()">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </button>
                <button class="icon-btn" title="Edit Dashboard" onclick="handleEditClick()">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="metrics-grid">
            <!-- Visitors Card -->
            <div class="metric-card">
                <div class="metric-label">
                    Visitors
                    <span class="metric-change positive">+12.5%</span>
                </div>
                <div class="metric-value">18,392</div>
                <div class="progress-bar">
                    <div class="progress-fill green" style="width: 72%;"></div>
                </div>
            </div>

            <!-- Conversions Card -->
            <div class="metric-card">
                <div class="metric-label">
                    Conversions
                    <span class="metric-change warning">+3.2%</span>
                </div>
                <div class="metric-value">4,827</div>
                <div class="progress-bar">
                    <div class="progress-fill orange" style="width: 45%;"></div>
                </div>
            </div>
        </div>

        <!-- Traffic Sources -->
        <div class="traffic-section">
            <div class="traffic-header">
                <h2 class="live-indicator">Traffic Sources</h2>
                <span class="time-badge">This Week</span>
            </div>
            <div class="traffic-list">
                <div class="traffic-item">
                    <span class="traffic-source">Organic Search</span>
                    <span class="traffic-percentage">43%</span>
                </div>
                <div class="traffic-item">
                    <span class="traffic-source">Social Media</span>
                    <span class="traffic-percentage">23%</span>
                </div>
                <div class="traffic-item">
                    <span class="traffic-source">Direct</span>
                    <span class="traffic-percentage">19%</span>
                </div>
                <div class="traffic-item">
                    <span class="traffic-source">Referral</span>
                    <span class="traffic-percentage">10%</span>
                </div>
            </div>
        </div>

        <!-- Full Report Button -->
        <button class="report-button" onclick="handleReportClick()">
            Full Report
        </button>
    </div>

    <script>
        // Animate progress bars on load
        window.addEventListener('load', () => {
            const progressBars = document.querySelectorAll('.progress-fill');
            progressBars.forEach((bar, index) => {
                setTimeout(() => {
                    bar.style.opacity = '1';
                }, index * 100);
            });
        });

        // Handle Profile Click
        function handleProfileClick() {
            alert('Profile clicked! This would typically open a user profile menu or settings panel.');
        }

        // Handle Edit Click
        function handleEditClick() {
            alert('Edit clicked! This would typically allow you to customize the dashboard layout and widgets.');
        }

        // Handle Report Click
        function handleReportClick() {
            alert('Full Report clicked! This would typically navigate to a detailed analytics report page.');
            // In a real application, you might do:
            // window.location.href = '/full-report';
        }

        // Simulate live data updates (optional)
        function updateMetrics() {
            const visitors = document.querySelector('.metrics-grid .metric-card:first-child .metric-value');
            const conversions = document.querySelector('.metrics-grid .metric-card:last-child .metric-value');

            // Simulate random small changes
            const visitorChange = Math.floor(Math.random() * 10) - 5;
            const conversionChange = Math.floor(Math.random() * 5) - 2;

            const currentVisitors = parseInt(visitors.textContent.replace(',', ''));
            const currentConversions = parseInt(conversions.textContent.replace(',', ''));

            visitors.textContent = (currentVisitors + visitorChange).toLocaleString();
            conversions.textContent = (currentConversions + conversionChange).toLocaleString();
        }

        // Uncomment to enable live updates every 5 seconds
        // setInterval(updateMetrics, 5000);

        // Add hover effects for metric cards
        const metricCards = document.querySelectorAll('.metric-card');
        metricCards.forEach(card => {
            card.addEventListener('click', function() {
                const label = this.querySelector('.metric-label').textContent.trim().split('\n')[0];
                alert(`Clicked on ${label}. This would typically show detailed metrics for this category.`);
            });
        });

        // Add click handlers for traffic items
        const trafficItems = document.querySelectorAll('.traffic-item');
        trafficItems.forEach(item => {
            item.addEventListener('click', function() {
                const source = this.querySelector('.traffic-source').textContent;
                const percentage = this.querySelector('.traffic-percentage').textContent;
                alert(`Traffic from ${source}: ${percentage}\nClick to see detailed breakdown.`);
            });
        });

        // Keyboard accessibility
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // Close any open modals or reset state
                console.log('Dashboard ready');
            }
        });

        // Log initialization
        console.log('Analytics Dashboard loaded successfully!');
        console.log('Features:');
        console.log('- Real-time metrics display');
        console.log('- Interactive cards with hover effects');
        console.log('- Traffic source breakdown');
        console.log('- Responsive design');
    </script>
</body>
</html>
