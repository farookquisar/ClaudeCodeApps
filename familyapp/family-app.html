<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Hub - Manage Your Family Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: var(--bg-color);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .card h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .member-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 15px;
            color: white;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            margin: 0 auto 15px;
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        .member-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }

        .member-role {
            text-align: center;
            opacity: 0.9;
            font-size: 0.95em;
        }

        .event-item {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .event-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow);
        }

        .event-date {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .event-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .event-description {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            background: #e2e8f0;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--success-color);
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .task-assignee {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .note-item {
            background: #fef3c7;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .note-author {
            font-weight: bold;
            color: #92400e;
        }

        .note-date {
            font-size: 0.85em;
            color: #92400e;
            opacity: 0.7;
        }

        .note-content {
            color: #78350f;
            line-height: 1.6;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .photo-placeholder {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-placeholder:hover {
            transform: scale(1.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 25px;
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: var(--primary-color);
            font-size: 1.5em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .close-btn:hover {
            color: var(--danger-color);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .nav-tabs {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
                justify-content: center;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍👩‍👧‍👦 Family Hub</h1>
            <p>Stay connected and organized as a family</p>
        </div>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="overview">📊 Overview</button>
            <button class="tab-btn" data-tab="members">👥 Members</button>
            <button class="tab-btn" data-tab="events">📅 Events</button>
            <button class="tab-btn" data-tab="tasks">✅ Tasks</button>
            <button class="tab-btn" data-tab="notes">📝 Notes</button>
            <button class="tab-btn" data-tab="photos">📸 Photos</button>
        </nav>

        <!-- Overview Tab -->
        <div id="overview" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="memberCount">0</div>
                    <div class="stat-label">Family Members</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="eventCount">0</div>
                    <div class="stat-label">Upcoming Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="taskCount">0</div>
                    <div class="stat-label">Active Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="noteCount">0</div>
                    <div class="stat-label">Shared Notes</div>
                </div>
            </div>

            <div class="card">
                <h2>Recent Activity</h2>
                <div id="recentActivity"></div>
            </div>
        </div>

        <!-- Members Tab -->
        <div id="members" class="tab-content">
            <div class="card">
                <h2>Family Members</h2>
                <button class="btn btn-primary" onclick="openAddMemberModal()">➕ Add Member</button>
                <div class="grid" id="membersList"></div>
            </div>
        </div>

        <!-- Events Tab -->
        <div id="events" class="tab-content">
            <div class="card">
                <h2>Family Events</h2>
                <button class="btn btn-primary" onclick="openAddEventModal()">➕ Add Event</button>
                <div id="eventsList"></div>
            </div>
        </div>

        <!-- Tasks Tab -->
        <div id="tasks" class="tab-content">
            <div class="card">
                <h2>Family Tasks & Chores</h2>
                <button class="btn btn-primary" onclick="openAddTaskModal()">➕ Add Task</button>
                <div id="tasksList"></div>
            </div>
        </div>

        <!-- Notes Tab -->
        <div id="notes" class="tab-content">
            <div class="card">
                <h2>Shared Notes</h2>
                <button class="btn btn-primary" onclick="openAddNoteModal()">➕ Add Note</button>
                <div id="notesList"></div>
            </div>
        </div>

        <!-- Photos Tab -->
        <div id="photos" class="tab-content">
            <div class="card">
                <h2>Family Photos</h2>
                <button class="btn btn-primary" onclick="openAddPhotoModal()">➕ Add Photo</button>
                <div class="photo-grid" id="photosList"></div>
            </div>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div id="addMemberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Family Member</h3>
                <button class="close-btn" onclick="closeModal('addMemberModal')">&times;</button>
            </div>
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="memberName" placeholder="Enter name">
            </div>
            <div class="input-group">
                <label>Role</label>
                <select id="memberRole">
                    <option value="Parent">Parent</option>
                    <option value="Child">Child</option>
                    <option value="Grandparent">Grandparent</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="input-group">
                <label>Emoji Avatar</label>
                <input type="text" id="memberEmoji" placeholder="👨 👩 👦 👧" maxlength="2">
            </div>
            <button class="btn btn-primary" onclick="addMember()">Add Member</button>
        </div>
    </div>

    <!-- Add Event Modal -->
    <div id="addEventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Event</h3>
                <button class="close-btn" onclick="closeModal('addEventModal')">&times;</button>
            </div>
            <div class="input-group">
                <label>Event Title</label>
                <input type="text" id="eventTitle" placeholder="Enter event title">
            </div>
            <div class="input-group">
                <label>Date</label>
                <input type="date" id="eventDate">
            </div>
            <div class="input-group">
                <label>Description</label>
                <textarea id="eventDescription" rows="3" placeholder="Enter event description"></textarea>
            </div>
            <button class="btn btn-primary" onclick="addEvent()">Add Event</button>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div id="addTaskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Task</h3>
                <button class="close-btn" onclick="closeModal('addTaskModal')">&times;</button>
            </div>
            <div class="input-group">
                <label>Task Title</label>
                <input type="text" id="taskTitle" placeholder="Enter task title">
            </div>
            <div class="input-group">
                <label>Assign To</label>
                <select id="taskAssignee">
                    <option value="">Select member</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="addTask()">Add Task</button>
        </div>
    </div>

    <!-- Add Note Modal -->
    <div id="addNoteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Note</h3>
                <button class="close-btn" onclick="closeModal('addNoteModal')">&times;</button>
            </div>
            <div class="input-group">
                <label>Author</label>
                <select id="noteAuthor">
                    <option value="">Select member</option>
                </select>
            </div>
            <div class="input-group">
                <label>Note Content</label>
                <textarea id="noteContent" rows="4" placeholder="Write your note here..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="addNote()">Add Note</button>
        </div>
    </div>

    <!-- Add Photo Modal -->
    <div id="addPhotoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Photo</h3>
                <button class="close-btn" onclick="closeModal('addPhotoModal')">&times;</button>
            </div>
            <div class="input-group">
                <label>Photo Emoji/Icon</label>
                <input type="text" id="photoEmoji" placeholder="📷 🎉 🎂 🏖️" maxlength="2">
            </div>
            <div class="input-group">
                <label>Caption (Optional)</label>
                <input type="text" id="photoCaption" placeholder="Enter caption">
            </div>
            <button class="btn btn-primary" onclick="addPhoto()">Add Photo</button>
        </div>
    </div>

    <script>
        // Data storage
        let familyData = {
            members: [],
            events: [],
            tasks: [],
            notes: [],
            photos: []
        };

        // Load data from localStorage
        function loadData() {
            const savedData = localStorage.getItem('familyHubData');
            if (savedData) {
                familyData = JSON.parse(savedData);
            }
            updateUI();
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('familyHubData', JSON.stringify(familyData));
            updateUI();
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(tabId).classList.add('active');
            });
        });

        // Modal functions
        function openAddMemberModal() {
            document.getElementById('addMemberModal').classList.add('active');
        }

        function openAddEventModal() {
            document.getElementById('addEventModal').classList.add('active');
        }

        function openAddTaskModal() {
            updateTaskAssigneeSelect();
            document.getElementById('addTaskModal').classList.add('active');
        }

        function openAddNoteModal() {
            updateNoteAuthorSelect();
            document.getElementById('addNoteModal').classList.add('active');
        }

        function openAddPhotoModal() {
            document.getElementById('addPhotoModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Add member
        function addMember() {
            const name = document.getElementById('memberName').value.trim();
            const role = document.getElementById('memberRole').value;
            const emoji = document.getElementById('memberEmoji').value.trim() || '👤';

            if (!name) {
                alert('Please enter a name');
                return;
            }

            familyData.members.push({
                id: Date.now(),
                name,
                role,
                emoji,
                addedDate: new Date().toISOString()
            });

            saveData();
            closeModal('addMemberModal');
            document.getElementById('memberName').value = '';
            document.getElementById('memberEmoji').value = '';
        }

        // Add event
        function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const description = document.getElementById('eventDescription').value.trim();

            if (!title || !date) {
                alert('Please enter title and date');
                return;
            }

            familyData.events.push({
                id: Date.now(),
                title,
                date,
                description,
                createdDate: new Date().toISOString()
            });

            saveData();
            closeModal('addEventModal');
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventDescription').value = '';
        }

        // Add task
        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const assignee = document.getElementById('taskAssignee').value;

            if (!title) {
                alert('Please enter a task title');
                return;
            }

            familyData.tasks.push({
                id: Date.now(),
                title,
                assignee,
                completed: false,
                createdDate: new Date().toISOString()
            });

            saveData();
            closeModal('addTaskModal');
            document.getElementById('taskTitle').value = '';
        }

        // Add note
        function addNote() {
            const author = document.getElementById('noteAuthor').value;
            const content = document.getElementById('noteContent').value.trim();

            if (!author || !content) {
                alert('Please select author and enter content');
                return;
            }

            familyData.notes.push({
                id: Date.now(),
                author,
                content,
                createdDate: new Date().toISOString()
            });

            saveData();
            closeModal('addNoteModal');
            document.getElementById('noteContent').value = '';
        }

        // Add photo
        function addPhoto() {
            const emoji = document.getElementById('photoEmoji').value.trim() || '📷';
            const caption = document.getElementById('photoCaption').value.trim();

            familyData.photos.push({
                id: Date.now(),
                emoji,
                caption,
                createdDate: new Date().toISOString()
            });

            saveData();
            closeModal('addPhotoModal');
            document.getElementById('photoEmoji').value = '';
            document.getElementById('photoCaption').value = '';
        }

        // Toggle task completion
        function toggleTask(taskId) {
            const task = familyData.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveData();
            }
        }

        // Delete functions
        function deleteMember(id) {
            if (confirm('Are you sure you want to delete this member?')) {
                familyData.members = familyData.members.filter(m => m.id !== id);
                saveData();
            }
        }

        function deleteEvent(id) {
            if (confirm('Are you sure you want to delete this event?')) {
                familyData.events = familyData.events.filter(e => e.id !== id);
                saveData();
            }
        }

        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                familyData.tasks = familyData.tasks.filter(t => t.id !== id);
                saveData();
            }
        }

        function deleteNote(id) {
            if (confirm('Are you sure you want to delete this note?')) {
                familyData.notes = familyData.notes.filter(n => n.id !== id);
                saveData();
            }
        }

        function deletePhoto(id) {
            if (confirm('Are you sure you want to delete this photo?')) {
                familyData.photos = familyData.photos.filter(p => p.id !== id);
                saveData();
            }
        }

        // Update UI
        function updateUI() {
            updateStats();
            updateMembersList();
            updateEventsList();
            updateTasksList();
            updateNotesList();
            updatePhotosList();
            updateRecentActivity();
        }

        function updateStats() {
            document.getElementById('memberCount').textContent = familyData.members.length;
            document.getElementById('eventCount').textContent = familyData.events.length;
            document.getElementById('taskCount').textContent = familyData.tasks.filter(t => !t.completed).length;
            document.getElementById('noteCount').textContent = familyData.notes.length;
        }

        function updateMembersList() {
            const container = document.getElementById('membersList');
            if (familyData.members.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>No family members added yet</p></div>';
                return;
            }

            container.innerHTML = familyData.members.map(member => `
                <div class="member-card">
                    <div class="member-avatar">${member.emoji}</div>
                    <div class="member-name">${member.name}</div>
                    <div class="member-role">${member.role}</div>
                </div>
            `).join('');
        }

        function updateEventsList() {
            const container = document.getElementById('eventsList');
            if (familyData.events.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><p>No events scheduled</p></div>';
                return;
            }

            const sortedEvents = [...familyData.events].sort((a, b) => new Date(a.date) - new Date(b.date));

            container.innerHTML = sortedEvents.map(event => {
                const date = new Date(event.date);
                const formattedDate = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                return `
                    <div class="event-item">
                        <div class="event-date">${formattedDate}</div>
                        <div class="event-title">${event.title}</div>
                        <div class="event-description">${event.description}</div>
                    </div>
                `;
            }).join('');
        }

        function updateTasksList() {
            const container = document.getElementById('tasksList');
            if (familyData.tasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><p>No tasks added yet</p></div>';
                return;
            }

            container.innerHTML = familyData.tasks.map(task => {
                const member = familyData.members.find(m => m.id == task.assignee);
                const assigneeName = member ? member.name : 'Unassigned';

                return `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <input type="checkbox" class="task-checkbox"
                               ${task.completed ? 'checked' : ''}
                               onchange="toggleTask(${task.id})">
                        <div class="task-content">
                            <div class="task-title">${task.title}</div>
                            <div class="task-assignee">Assigned to: ${assigneeName}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateNotesList() {
            const container = document.getElementById('notesList');
            if (familyData.notes.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><p>No notes added yet</p></div>';
                return;
            }

            const sortedNotes = [...familyData.notes].sort((a, b) => new Date(b.createdDate) - new Date(a.createdDate));

            container.innerHTML = sortedNotes.map(note => {
                const member = familyData.members.find(m => m.id == note.author);
                const authorName = member ? member.name : 'Unknown';
                const date = new Date(note.createdDate);
                const formattedDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                return `
                    <div class="note-item">
                        <div class="note-header">
                            <div class="note-author">${authorName}</div>
                            <div class="note-date">${formattedDate}</div>
                        </div>
                        <div class="note-content">${note.content}</div>
                    </div>
                `;
            }).join('');
        }

        function updatePhotosList() {
            const container = document.getElementById('photosList');
            if (familyData.photos.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📸</div><p>No photos added yet</p></div>';
                return;
            }

            container.innerHTML = familyData.photos.map(photo => `
                <div class="photo-placeholder" title="${photo.caption}">
                    ${photo.emoji}
                </div>
            `).join('');
        }

        function updateRecentActivity() {
            const container = document.getElementById('recentActivity');

            const allActivities = [
                ...familyData.members.map(m => ({ type: 'member', date: m.addedDate, text: `${m.name} joined the family` })),
                ...familyData.events.map(e => ({ type: 'event', date: e.createdDate, text: `Event "${e.title}" added` })),
                ...familyData.tasks.map(t => ({ type: 'task', date: t.createdDate, text: `Task "${t.title}" created` })),
                ...familyData.notes.map(n => ({ type: 'note', date: n.createdDate, text: `New note added` })),
                ...familyData.photos.map(p => ({ type: 'photo', date: p.createdDate, text: `New photo added` }))
            ];

            const sortedActivities = allActivities.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10);

            if (sortedActivities.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><p>No activity yet</p></div>';
                return;
            }

            container.innerHTML = sortedActivities.map(activity => {
                const date = new Date(activity.date);
                const formattedDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                return `
                    <div class="event-item">
                        <div class="event-date">${formattedDate}</div>
                        <div class="event-title">${activity.text}</div>
                    </div>
                `;
            }).join('');
        }

        function updateTaskAssigneeSelect() {
            const select = document.getElementById('taskAssignee');
            select.innerHTML = '<option value="">Select member</option>' +
                familyData.members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        }

        function updateNoteAuthorSelect() {
            const select = document.getElementById('noteAuthor');
            select.innerHTML = '<option value="">Select member</option>' +
                familyData.members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        }

        // Close modal when clicking outside
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
